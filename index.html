<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StarTable — Fine Dining Discovery</title>
<meta name="description" content="Discover, compare and reserve the world's finest restaurants.">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <div class="shell nav">
    <a class="brand" href="#"><span class="brand-star">★</span><span>StarTable</span></a>
    <div class="nav-actions">
      <button id="themeButton" class="ghost">Theme</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="shell hero-grid">
    <div>
      <p class="eyebrow">FINE DINING DISCOVERY</p>
      <h1>Discover the world’s<br>finest restaurants.</h1>
      <p class="sub">Search Michelin-starred and fine dining restaurants, compare lunch and dinner courses, then jump to the official reservation page.</p>
    </div>
    <div class="hero-card">
      <div><strong id="totalRestaurants">11</strong><span>restaurants</span></div>
      <div><strong id="totalCourses">0</strong><span>courses</span></div>
      <div><strong>Tokyo</strong><span>current city</span></div>
    </div>
  </div>
</section>

<main class="shell">
  <section class="controls">
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search restaurant, cuisine, area or course">
    </div>
    <div class="filter-grid">
      <select id="cityFilter"><option value="">All cities</option></select>
      <select id="starFilter"><option value="">All stars</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select>
      <select id="cuisineFilter"><option value="">All cuisines</option></select>
      <select id="areaFilter"><option value="">All areas</option></select>
      <select id="difficultyFilter"><option value="">All difficulty</option><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option></select>
    </div>
    <div class="meal-toggle" role="tablist">
      <button class="meal-btn active" data-meal="all">All</button>
      <button class="meal-btn" data-meal="lunch">Lunch</button>
      <button class="meal-btn" data-meal="dinner">Dinner</button>
    </div>
  </section>

  <section class="result-bar">
    <div><strong id="visibleCount">0</strong> restaurants</div>
    <button id="resetButton" class="ghost">Reset</button>
  </section>

  <section id="restaurantGrid" class="grid"></section>
  <div id="emptyState" class="empty" hidden>No matching restaurants.</div>
</main>

<template id="restaurantTemplate">
<article class="card">
  <button class="card-head" aria-expanded="false">
    <div>
      <div class="meta-line"><span class="city"></span><span class="dot">•</span><span class="area"></span></div>
      <h2 class="name"></h2>
      <div class="name-ja"></div>
      <div class="chips"></div>
    </div>
    <div class="stars"></div>
  </button>
  <div class="detail" hidden>
    <div class="info-grid">
      <section class="panel">
        <h3>Reservation</h3>
        <div class="difficulty"></div>
        <p class="booking"></p>
        <a class="reserve" target="_blank" rel="noopener">Official reservation</a>
      </section>
      <section class="panel">
        <h3>Anniversary</h3>
        <p class="plate"></p>
      </section>
    </div>
    <div class="meal-tabs">
      <button class="local-meal active" data-localmeal="lunch">Lunch</button>
      <button class="local-meal" data-localmeal="dinner">Dinner</button>
    </div>
    <div class="course-table"></div>
  </div>
</article>
</template>

<script src="./app.js"></script>
</body>
</html>
